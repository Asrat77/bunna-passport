name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  scan_js:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-24.04
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-24.04

    # services:
    #  redis:
    #    image: valkey/valkey:8
    #    ports:
    #      - 6379:6379
    #    options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      # Downloading these from the Ubuntu mirrors is slow (often 75 kB/s, 2-8
      # minutes) and sometimes fails with 503s, so keep the .debs in the
      # Actions cache, keyed on the runner image's release date (the build
      # number after it differs from runner to runner). A newer image falls
      # back to the last cache; dpkg refuses to downgrade anything the image
      # already ships, and then the step downloads fresh packages instead.
      - name: Note the runner image
        id: runner-image
        run: echo "version=$ImageOS-${ImageVersion%%.*}" >> "$GITHUB_OUTPUT"

      - name: Restore apt package cache
        id: apt-cache
        uses: actions/cache@v6
        with:
          path: ~/apt-debs
          key: apt-debs-v1-${{ steps.runner-image.outputs.version }}-libvips-librsvg2-bin-fontconfig
          restore-keys: |
            apt-debs-v1-

      - name: Install packages
        env:
          PACKAGES: libvips librsvg2-bin fontconfig
        run: |
          mkdir -p ~/apt-debs
          install_from_cache() {
            ls ~/apt-debs/*.deb >/dev/null 2>&1 || return 0
            sudo dpkg -i --refuse-downgrade ~/apt-debs/*.deb
          }
          if ls ~/apt-debs/*.deb >/dev/null 2>&1 && install_from_cache; then
            echo "Installed from cache: $(ls ~/apt-debs)"
            exit 0
          fi
          # security.ubuntu.com sometimes answers 503 for minutes at a time;
          # retry each download and the whole download before failing the job.
          rm -f ~/apt-debs/*.deb
          for attempt in 1 2 3; do
            sudo apt-get update &&
              sudo apt-get install -o Acquire::Retries=5 -o Dir::Cache::Archives="$HOME/apt-debs" \
                --download-only --no-install-recommends -y $PACKAGES &&
              break
            [ "$attempt" = 3 ] && exit 1
            echo "apt attempt $attempt failed, retrying in 30s"; sleep 30
          done
          # Install with apt (it reuses the downloaded .debs) so a half-done
          # dpkg run from a stale cache gets repaired too.
          sudo apt-get install -o Dir::Cache::Archives="$HOME/apt-debs" --no-install-recommends -y $PACKAGES
          sudo rm -rf ~/apt-debs/partial ~/apt-debs/lock
          sudo chown -R "$USER" ~/apt-debs

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install share card fonts
        run: mkdir -p ~/.local/share/fonts && cp vendor/fonts/share_card/*.ttf ~/.local/share/fonts/ && fc-cache -f

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test

  system-test:
    runs-on: ubuntu-24.04

    # services:
    #  redis:
    #    image: valkey/valkey:8
    #    ports:
    #      - 6379:6379
    #    options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run System Tests
        env:
          RAILS_ENV: test
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test:system

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install packages
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type-check and build
        run: npm run build
