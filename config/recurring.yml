production:
  refresh_current_leaderboards:
    class: RefreshLeaderboardsJob
    args: [ week, month ]
    schedule: every 15 minutes

  refresh_all_time_leaderboards:
    class: RefreshLeaderboardsJob
    args: [ all_time ]
    schedule: every hour

  # Afternoon buna time in Addis. Only people whose doodle is still asleep.
  send_daily_nudges:
    class: SendDailyNudgesJob
    schedule: "0 15 * * * Africa/Addis_Ababa"

  # Evening round-up of friends' new stamps and reactions, once a day at most.
  send_friend_digests:
    class: SendFriendDigestsJob
    schedule: "30 19 * * * Africa/Addis_Ababa"

  # Morning summary of the moderation queues, with buttons for easy cases.
  send_moderation_digest:
    class: SendModerationDigestJob
    schedule: "0 9 * * * Africa/Addis_Ababa"

  # Last week's numbers, before the moderation digest.
  send_weekly_report:
    class: SendWeeklyReportJob
    schedule: "45 8 * * 1 Africa/Addis_Ababa"

  # Telegram alert before the shared disk fills.
  check_host_health:
    class: CheckHostHealthJob
    schedule: every hour at minute 7

  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
