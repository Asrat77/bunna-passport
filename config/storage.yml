test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Cloudflare R2, through its S3-compatible API. Kept apart from the bucket that
# holds the off-host backups: different contents, different token, different
# retention. See docs/OPERATIONS.md for creating the bucket and token.
r2:
  service: S3
  endpoint: https://<%= ENV["R2_ACCOUNT_ID"] %>.r2.cloudflarestorage.com
  access_key_id: <%= ENV["R2_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["R2_SECRET_ACCESS_KEY"] %>
  bucket: <%= ENV["R2_BUCKET"] %>
  region: auto
  force_path_style: true
  # R2 rejects some of the checksum headers newer AWS SDKs send by default.
  request_checksum_calculation: when_required
  response_checksum_validation: when_required
