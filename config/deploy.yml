# Name of your application. Used to uniquely configure containers.
service: bunna_passport

# Required deployment values intentionally have no defaults. Supplying them is
# an explicit infrastructure decision; this repository does not deploy itself.
image: <%= ENV.fetch("BUNNA_DEPLOY_IMAGE") %>

# Deploy to these servers.
servers:
  web:
    - <%= ENV.fetch("BUNNA_DEPLOY_HOST") %>
  # job:
  #   hosts:
  #     - 192.168.0.1
  #   cmd: bin/jobs

# Terminate TLS at the Kamal proxy with a Let's Encrypt certificate. This is a
# single web server, so the certificate lives on the host rather than at a load
# balancer. production.rb sets assume_ssl and force_ssl to match.
proxy:
  ssl: true
  host: <%= ENV.fetch("BUNNA_APP_HOST") %>

# Where you keep your container images.
registry:
  server: <%= ENV.fetch("BUNNA_REGISTRY_SERVER") %>

  username: <%= ENV.fetch("BUNNA_REGISTRY_USERNAME") %>

  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    # Run the Solid Queue Supervisor inside the web server's Puma process to do jobs.
    # When you start using multiple servers, you should split out job processing to a dedicated machine.
    SOLID_QUEUE_IN_PUMA: true

    # Canonical external host. Mailer links and host authorization both read it.
    BUNNA_APP_HOST: <%= ENV.fetch("BUNNA_APP_HOST") %>
    BUNNA_APP_PROTOCOL: https

    # Set number of processes dedicated to Solid Queue (default: 1)
    # JOB_CONCURRENCY: 3

    # Set number of cores available to the application on each server (default: 1).
    # WEB_CONCURRENCY: 2

    # Match this to any external database server to configure Active Record correctly
    # Use bunna_passport-db for a db accessory server on same machine via local kamal docker network.
    # DB_HOST: 192.168.0.2

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Use a persistent storage volume for sqlite database files and local Active Storage files.
# Recommended to change this to a mounted volume path that is backed up off server.
volumes:
  - "bunna_passport_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64

  # Build on the deployment host itself. It is already amd64, so this avoids
  # slow QEMU emulation on arm64 workstations and keeps build layers off the
  # developer's disk.
  remote: ssh://<%= ENV.fetch("BUNNA_DEPLOY_SSH_USER") %>@<%= ENV.fetch("BUNNA_DEPLOY_HOST") %>

  # # Pass arguments and secrets to the Docker build process
  # args:
  #   RUBY_VERSION: 3.4.2
  # secrets:
  #   - GITHUB_TOKEN
  #   - RAILS_MASTER_KEY

# Cloud images disable root login, so Kamal connects as the provisioned user.
ssh:
  user: <%= ENV.fetch("BUNNA_DEPLOY_SSH_USER") %>

